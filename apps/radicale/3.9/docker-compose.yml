networks:
  1panel-network:
    external: true

services:
  radicale:
    image: kozea/radicale:3.9
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    user: root
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:5232
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${RADICALE_ROOT_PATH}/config:/etc/radicale:ro
      - ${RADICALE_ROOT_PATH}/data:/var/lib/radicale
    environment:
      - TZ=Asia/Shanghai
