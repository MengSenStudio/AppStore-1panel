networks:
  1panel-network:
    external: true

services:
  pt-tools:
    image: sunerpy/pt-tools:v1.1.2
    container_name: ${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    env_file:
      - ${GLOBAL_ENV_FILE:-/etc/1panel/envs/global.env}
      - ${ENV_FILE:-/etc/1panel/envs/default.env}
    volumes:
      - ${PT_TOOLS_ROOT_PATH}/data:/app/.pt-tools
    environment:
      - TZ=Asia/Shanghai
      - PT_WEB=1
      - PT_HOST=0.0.0.0
      - PT_PORT=8080
      - PUID=1000
      - PGID=1000
