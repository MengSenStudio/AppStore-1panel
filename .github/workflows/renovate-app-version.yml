name: Update app version in Renovate Branches

# Renovate 只改 docker-compose.yml 里的镜像 tag，这里把 apps/<app>/<version> 目录名
# 同步成主服务的新版本，保证 appstore 的目录结构正确。
# 逻辑见 script/renovate_app_version.py：会跳过 pg/redis 等中间件、跳过人工命名目录。

on:
  push:
    branches: [ 'renovate/*' ]
    paths:
      - 'apps/**/docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-app-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只在 renovate/* 分支上工作，手动触发时也不会误改 custom
    if: startsWith(github.ref_name, 'renovate/')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip pyyaml

      - name: Configure repo
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"

      - name: Rename version directories
        run: |
          set -euo pipefail

          # 只看本次推送的提交改动的 docker-compose.yml。
          # 不加 -m：Renovate 推送的都是普通单父提交；如果推送的是 merge commit，
          # -m 会把基线侧的改动也算进来，可能误改无关的应用目录，这里宁可跳过。
          mapfile -t files < <(
            git diff-tree --no-commit-id --name-only -r HEAD \
              | grep -E '^apps/[^/]+/[^/]+/docker-compose\.yml$' \
              | sort -u || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "本次推送没有 docker-compose.yml 变更"
            exit 0
          fi

          for file in "${files[@]}"; do
            IFS='/' read -r _ app_name old_version _ <<< "$file"
            echo "处理 $app_name（当前版本目录 $old_version）"
            python script/renovate_app_version.py "$app_name" "$old_version"
          done

      - name: Commit and push version directory changes
        run: |
          set -euo pipefail
          git add -A apps
          if git diff --cached --quiet; then
            echo "版本目录无需变更"
            exit 0
          fi

          git commit --quiet -m "chore: sync app version directories [skip ci]"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "已推送版本目录变更"
              exit 0
            fi
            echo "推送失败（第 ${attempt} 次），同步远端后重试…"
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git rebase --quiet FETCH_HEAD || { git rebase --abort || true; exit 1; }
            sleep 5
          done

          echo "连续 3 次推送失败" >&2
          exit 1
