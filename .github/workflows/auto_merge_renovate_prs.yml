name: Auto Process Renovate PRs

# 省流说明：
# * 旧实现：每小时 + 每个 PR 事件都跑，对每个 PR 串行等待 10 分钟，
#   超时后反复勾选 rebase，并往 PR 里刷重复评论（历史 PR 上出现过 100 条相同评论）。
# * 新实现：一次只评估一遍、绝不阻塞；由事件驱动重试；状态评论幂等；
#   rebase 有次数上限和冷却时间；major 交给人工。逻辑见 script/process_renovate_prs.py。
# * 注意：Renovate 由仓库安装的 Mend App 运行，勾选的 rebase 复选框会在其下一次
#   运行时处理；本仓库没有可立即触发的自托管 Renovate Action。

on:
  # Renovate 新建 / 更新 PR 时立即评估。
  # 用 pull_request_target 而不是 pull_request，是为了让本工作流的检查跑在基线分支上，
  # 不出现在 PR 的检查列表里（旧实现会出现“等自己这次运行通过”的死循环）。
  # 安全说明：只读取 PR 元数据，从不 checkout PR 分支的代码。
  pull_request_target:
    types: [ opened, reopened, ready_for_review, synchronize ]
  # 版本目录重命名工作流跑完后重试合并（这是最主要的“检查完成”信号）。
  workflow_run:
    workflows:
      - Update app version in Renovate Branches
    types: [ completed ]
  # 兜底：处理错过事件、或后来才满足合并条件的 PR。
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write        # 合并 PR
  pull-requests: write   # 更新 PR 描述、评论
  issues: write          # 维护状态评论
  actions: write         # 合并后触发 process-apps 重新生成数据

concurrency:
  group: auto-merge-renovate-prs
  # 排队执行而不是取消：保证已合并的 PR 一定会触发后续的 appstore 重新生成。
  # 事件密集时 GitHub 只保留最新一条排队运行、取消更早的排队运行；因为每次运行都是
  # 全量评估，被取消的那次不会造成漏合并（下一次运行会把所有 PR 重新看一遍）。
  cancel-in-progress: false

jobs:
  process-renovate-prs:
    name: process-renovate-prs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Process Renovate PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SELF_CHECK_NAME: process-renovate-prs
          MAX_REBASE_ATTEMPTS: '3'
          REBASE_COOLDOWN_MINUTES: '60'
          MERGE_METHOD: auto
        run: python3 -u script/process_renovate_prs.py
